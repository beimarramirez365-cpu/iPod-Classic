name: pipeline-workflow
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  echo-job:
    name: Run Echo Commands
    runs-on: self-hosted

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Step 1 - B  asic Echo
        run: echo "Hello! This is a simple GitHub Actions pipeline."

      - name: Step 2 - Echo Current Date
        run: 'echo "The current date and time is: $(date)"'

      - name: step 3 
        run: docker build -t image-ipod-c2 .
  deploy-job:
    name: Run deploy
    runs-on: self-hosted

    steps: 
      - name: deploy

        run: docker run -P image-ipod-c2

